# Keeps the profile alive: every day it
#   1) redraws the fastfetch card (Uptime, Commits this month) and commits it to main
#   2) draws Pac-Man eating my contribution graph into the "output" branch
name: profile

on:
  schedule:
    - cron: "0 3 * * *"     # every day at 03:00 UTC (05:00 Cairo)
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Redraw the fastfetch card
        run: python3 scripts/fastfetch-card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit it if something changed
        run: |
          if git diff --quiet -- assets/fastfetch.svg; then
            echo "Card unchanged, nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fastfetch.svg
          git commit -m "Daily card refresh"
          git push

  pacman:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman

      - name: Recolour the dark version to Dos Moos
        run: |
          sudo sed -i \
            -e 's/#0d1117/#04090F/gI' \
            -e 's/#161b22/#1d2227/gI' \
            -e 's/#8b949e/#5b6065/gI' \
            -e 's/#ffffff/#e5fffb/gI' \
            -e 's/#0e4429/#1f4d33/gI' \
            -e 's/#006d32/#2b8b37/gI' \
            -e 's/#26a641/#46b43d/gI' \
            -e 's/#39d353/#00facf/gI' \
            dist/pacman-contribution-graph-dark.svg

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
